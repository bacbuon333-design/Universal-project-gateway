schema_version: "1.0"
contract_version: upg.manifest/v1
project_id: universal-project-gateway
name: Universal Project Gateway
description: Local project-agnostic orchestration layer for scoped AI-assisted software work.
project_type: python

sources:
  local_path: "."
  github_repository: https://github.com/bacbuon333-design/Universal-project-gateway

stack:
  language: Python
  minimum_version: "3.11"
  dependency_manager: pip
  service_interfaces:
    - CLI
    - MCP
  managed_path_groups:
    source:
      - src/universal_project_gateway/
    documentation:
      - README.md
      - docs/
      - state/CURRENT_STATE.json
    tests:
      - tests/
    scripts:
      - scripts/
      - DOCTOR_GATEWAY.bat
      - PULL_AND_VERIFY.bat
      - REGISTER_PROJECT.bat
      - RUN_DEMO.bat
      - START_GATEWAY.bat
      - VERIFY_GATEWAY.bat

important_paths:
  - src/universal_project_gateway/
  - tests/
  - scripts/
  - docs/
  - registry/projects.yaml
  - state/CURRENT_STATE.json
  - README.md
  - pyproject.toml
  - requirements.lock
  - DOCTOR_GATEWAY.bat
  - PULL_AND_VERIFY.bat
  - REGISTER_PROJECT.bat
  - RUN_DEMO.bat
  - START_GATEWAY.bat
  - VERIFY_GATEWAY.bat

entrypoints:
  cli: src/universal_project_gateway/cli.py
  mcp_service: src/universal_project_gateway/mcp_server.py
  manifest_verification: scripts/verify_manifest.py
  evidence_verification: scripts/verify_gateway.py
  demo: scripts/run_demo.py
  gateway_verification: VERIFY_GATEWAY.bat
  gateway_doctor: DOCTOR_GATEWAY.bat
  pull_and_verify: PULL_AND_VERIFY.bat

memory_files:
  - AGENTS.md

commands:
  install: null
  lint:
    argv:
      - python
      - -m
      - compileall
      - -q
      - src
      - scripts
      - tests
  test:
    argv:
      - python
      - -m
      - pytest
      - tests
      - --strict-config
  build:
    argv:
      - python
      - -m
      - compileall
      - -q
      - src
      - scripts
  smoke_test:
    argv:
      - python
      - -m
      - pytest
      - -q
      - tests/unit/test_self_registration.py

permissions:
  read: true
  workspace_write: true
  validation: true
  git_publish: true

protected_paths:
  - .env
  - .env.*
  - .git/
  - .venv/
  - var/
  - workspaces/
  - artifacts/
  - secrets/
  - credentials/
  - "*.key"
  - "*.pem"

validation_requirements:
  - lint
  - test

publication_policy:
  allow_local_branch: true
  allow_push: false
  allow_merge: false

runtime_adapters:
  - python

adapter_requirements:
  - adapter_id: python
    adapter_version: "1.0.0"
    contract_version: upg.adapter/v1
    capabilities:
      - lint
      - test

state_file: state/CURRENT_STATE.json

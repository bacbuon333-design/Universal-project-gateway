[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-project-gateway"
version = "0.1.0"
description = "A local, project-agnostic gateway for scoped AI-assisted software work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Universal Project Gateway contributors" }]
dependencies = [
  "mcp==1.28.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.21",
]

[project.scripts]
upg = "universal_project_gateway.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
